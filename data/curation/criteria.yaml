# Evaluation-set curation criteria (Phase 7). Difficulty, area definitions, seed and labels were written
# before the draw. Added after it: `discards`, the amc12a_2020_p4 correction (see data/README.md), and the
# stated precedence of the mathd prefix and the binomial tie-break. No system result informed any of them.
# Nothing here depends on how the system performs on a problem: no C1-C5 run informs selection.
seed: 2026
sources:
  minif2f:
    name: "miniF2F (DeepSeek-Prover-V1.5 Lean 4 port, datasets/minif2f.jsonl)"
    commit: "2c4ba9119eef74d0d611f494261b2c5bae98c69a"
    license: "MIT"
  putnam:
    name: "PutnamBench (lean4/src, informal/putnam.json)"
    commit: "a635813f5edf297d928f9bd5ef8324a26bdde09c"
    license: "Apache-2.0 (Lean statement); informal text available with permission from the MAA"

# Difficulty is decided only by the competition of origin (team decision 2026-11-01).
difficulty:
  easy: "mathd_*"
  medium: "amc12*, aime*, algebra_*, numbertheory_*, induction_*"
  hard: "imo_*, imosl_*, putnam_*"

# Area definitions (team decision 2026-11-01: strict combinatorics).
# - mathd_* keep the area of their prefix; this takes precedence over the out-of-scope rule below.
# - combinatorics: counting configurations, binomials and their identities, pigeonhole, graphs,
#   partitions. Counting integers that satisfy an arithmetic condition is NOT combinatorics.
#   A divisibility or primality claim about a binomial sum is number theory.
# - algebra: equations, inequalities, polynomials, sequences, logarithms, functional equations.
# - out of scope: geometry, trigonometry, real analysis; these are never drawn.
# - putnam_*: only for cells miniF2F cannot fill (hard x combinatorics). Eligible: tagged
#   combinatorics, no geometry/analysis/probability/linear_algebra tag, and a single self-contained
#   theorem (factored `_solution` answers or local definitions do not fit `parse_theorem`).
target_per_cell: 5
# Proportional reassignment within the same difficulty, proportional to the target sizes of the
# other cells (5:5); an odd remainder goes to the larger pool. See data/README.md.
grid:
  easy: {algebra: 8, number_theory: 7, combinatorics: 0}
  medium: {algebra: 7, number_theory: 6, combinatorics: 2}
  hard: {algebra: 5, number_theory: 5, combinatorics: 5}
total_dev: 15

# Must be in `dev`: already used to look at plans and sketches.
reserved_dev: [amc12a_2015_p10, aime_1991_p1, amc12b_2004_p3, induction_divisibility_3div2tooddnp1,
               numbertheory_nckeqnm1ckpnm1ckm1]
# Named in tests or fixtures in the repo, so never drawn.
