# Manual discards from the fidelity review. id -> reason. A discarded problem is replaced by the
# next one in the seeded order of its cell.
discards:
  imo_1962_p2: >-
    Proves a different inequality: the informal text has an outer root (inner difference > 1/4, bound
    1 - sqrt(127)/32) while the formal statement has inner difference > 1/2, bound 1 - sqrt(31)/8.
    At x = 1/2 the informal inequality holds and the formal hypothesis fails (checked in Lean).
  imo_1974_p5: >-
    "Determine all possible values" is stated only as 1 < s < 2: attainment of every value in (1, 2),
    half of the answer, is missing, so the formal statement is essentially weaker.
