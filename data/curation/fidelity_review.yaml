# Informal-to-formal fidelity review of data/eval.jsonl (2026-11-01, subagent lean-expert).
# Never based on system results. Scope: all problems drawn, including the three replacements.
# Problems not listed under `notes` were kept with no remark.
rule: >-
  Discard if the formal statement changes the mathematics: false, contradictory hypotheses, a
  different claim, or an essential part of the answer lost ("determine" reduced to a bound).
discarded: [imo_1962_p2, imo_1974_p5]  # reasons in criteria.yaml
notes:
  mathd_algebra_455: "The sequence is already reduced to 2*(2*(2*(2*x)))=48; same mathematics."
  mathd_algebra_234: "Reduced to third term times d^3; the redundant second ratio is omitted."
  amc12b_2003_p6: >-
    States u 0 = +-2/sqrt 3 for every valid sequence, without saying -2*sqrt(3)/3 is attained. Kept: the
    conclusion determines the answer among the options (+2/sqrt 3 is not one), and the omitted part is a
    single witness. Both disjuncts are attained (proved in Lean), so the statement is not vacuous.
  imo_2006_p3: >-
    Matches the informal text of this record, which states only the bound. The one-sided form is
    equivalent to the |.| form (swapping a, b negates the left side). Omits the minimality of
    M = 9*sqrt(2)/32, so it is weaker than the full IMO 2006 P3 (re-checked 2026-11-03, lean-expert).
  imo_1987_p6: >-
    No n >= 2 hypothesis and a duplicate h0 binder. Harmless: the hypothesis is unsatisfiable for
    p < 2 (proved in Lean), so the truncated p - 2 does not matter.
  putnam_1995_b1: "Uses Exists.choose and relabels {1..9} as range 9; the chosen part is unique (proved in Lean)."
  putnam_1965_b2: "Losses defined as n - 1 - w r, computed in the integers, not counted."
verification_limits: >-
  Most truth checks are finite (Python) or by reading; the review establishes that statements match
  the informal text, not that they are theorems. imo_2006_p3 and putnam_1995_b1 were checked only for
  the match. mathd_numbertheory_232 rests on hand arithmetic: `decide` could not reduce the ZMod goal.
post_test_review:
  # Manual review after the runs on `test` (team decision 2026-11-03, PLAN.md Phase 9): every problem
  # solved on `test` by any configuration (C2 counts only if its --check proof was accepted) that has
  # an entry under `notes`. Accepted proof read against the informal text. The Lean verdict never
  # changes; this only decides how the success is reported. No count changes: all four count.
  date: 2026-11-07
  reviewed_by: team (Andres Mongui, Nicolas Tinjaca)
  not_applicable:
    imo_2006_p3: dev split
    imo_1987_p6: not solved on test by any configuration
    putnam_1995_b1: not solved on test by any configuration
  verdicts:
    mathd_algebra_455: {solved_by: [C1, C2_check, C3, C4, C5], counts: true, report_note: null,
      reason: "Faithful: the reduced equation is the problem."}
    mathd_algebra_234: {solved_by: [C1, C2_check, C3, C4, C5], counts: true, report_note: null,
      reason: "Faithful: the proofs compute the ratio and the sixth term."}
    putnam_1965_b2: {solved_by: [C1, C3, C5], counts: true, report_note: null,
      reason: "Faithful: defining l as n - 1 - w does not give the result away; every proof uses
        irreflexivity and antisymmetry to get sum w = n(n-1)/2 (C1 also proves l r equals the
        counted losses)."}
    amc12b_2003_p6:
      solved_by: [C1, C2_check, C3, C4, C5]
      counts: true
      report_note: >-
        The formalization proves that u 0 = +-2/sqrt 3 (a necessary condition), not that
        -2*sqrt(3)/3 is attained; this is enough to rule out the other options.
      reason: "Counts as solved, with the note above in the report."
