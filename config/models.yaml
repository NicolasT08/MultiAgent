# Single source of truth for every model the system uses (CLAUDE.md §1.2).
# Phase 1 only fills `embeddings`; LLM providers, models and profiles arrive in Phase 3.

embeddings:
  # Model used by the Retriever (Phase 1.5). Chosen on Q-dev (Phase 1.4, 2026-10-17):
  # hybrid retrieval = RRF(BM25, e5-base with query instruction), k = 16. The method and
  # k are pipeline settings (config/pipeline.yaml, Phase 1.5); only the model lives here.
  selected: e5-base

  # Candidates compared in Phase 1.3/1.4 (scripts/eval_retrieval.py).
  #   backend: sentence_transformers | byt5_mean (T5 encoder + masked mean pooling)
  #   query_instruction: prefix prepended to queries in the "with instruction" setting
  #   doc_prefix: prefix prepended to every indexed text (part of the index, always used)
  #   doc_template: how a corpus record becomes the indexed text
  candidates:
    bge-base:
      hf_id: BAAI/bge-base-en-v1.5
      backend: sentence_transformers
      max_length: 512
      query_instruction: "Represent this sentence for searching relevant passages: "
      doc_prefix: ""
      doc_template: "{text}"
    e5-base:
      hf_id: intfloat/e5-base-v2
      backend: sentence_transformers
      max_length: 512
      query_instruction: "query: "
      doc_prefix: "passage: "
      doc_template: "{text}"
    bge-small:
      hf_id: BAAI/bge-small-en-v1.5
      backend: sentence_transformers
      max_length: 512
      query_instruction: "Represent this sentence for searching relevant passages: "
      doc_prefix: ""
      doc_template: "{text}"
    bge-m3:
      hf_id: BAAI/bge-m3
      backend: sentence_transformers
      max_length: 512
      query_instruction: null   # BGE-M3 needs no instruction
      doc_prefix: ""
      doc_template: "{text}"
    reprover:
      hf_id: kaiyuy/leandojo-lean4-retriever-byt5-small   # MIT
      backend: byt5_mean
      max_length: 1024
      query_instruction: null
      doc_prefix: ""
      doc_template: "<a>{name}</a>{signature}"   # ReProver premise serialisation
