# Pipeline hyperparameters (k_max, r_max, N, b_max... arrive in later phases).
# Models are never named here: they live in config/models.yaml.

retrieval:
  # Chosen on Q-dev in Phase 1.4 (2026-10-17): RRF over BM25 and the dense model
  # `embeddings.selected` (models.yaml), query with the model's instruction, k = 16.
  method: rrf               # rrf (BM25 + dense) | bm25 | dense
  k: 16                     # lemmas returned to the Generator (~1.5k tokens of name + signature)
  depth: 100                # candidates taken from each ranker before fusion
  rrf_k: 60                 # RRF constant: score(d) = sum 1 / (rrf_k + rank)
  query_instruction: true   # prepend the dense model's query instruction
  # Second query with concrete carriers (ℝ, ℤ, …) replaced by a type variable, fused by RRF
  # with the original one (retriever.generalize_query). Adopted 2026-10-19 after a manual
  # error analysis (generic lemmas such as two_mul_le_add_sq ranked behind Real.*), checked
  # on Q-dev only; Q-test re-evaluated once afterwards (PLAN.md 1.5).
  generic_query: true
  index_dir: data/index/full   # system index built from the FULL corpus (not corpus_eval)
  suggestions: 5            # max names suggested for an `unknown identifier` error

lean:
  # Back-end chosen 2026-10-25 (PLAN.md Phase 2): the Lean REPL keeps Mathlib loaded
  # (~0.01-0.5 s per check vs ~32 s for `lake env lean` per file). Fallback: per file.
  backend: repl             # repl | file
  project_dir: lean_project
  repl_dir: lean_repl       # built by scripts/build_repl.sh (tag v4.36.0-rc1)
  # Imports of the REPL's environment 0. Code whose imports are a subset runs in the REPL;
  # any other import goes to the file back-end. Keep it closed under Mathlib (Aesop is
  # imported by Mathlib, listed so that miniF2F headers `import Mathlib / import Aesop` fit).
  base_imports: [Mathlib, Aesop]
  timeout_s: 60             # wall clock per verification; on expiry the REPL is restarted
  startup_timeout_s: 2400   # import Mathlib: ~33 s warm, ~28 min cold on an HDD
  restart_every: 500        # preventive restart after N commands (REPL never frees envs)
  restart_memory_mb: 6000   # preventive restart when the REPL exceeds this after a command
  kill_memory_mb: 12000     # kill (status memory_limit) when a command exceeds this; also `lean -M`
  memory_poll_s: 0.5
  cache_size: 4096          # identical verifications answered from memory (0 = off)
  # The file back-end's wall-clock limit is timeout_s + the import time it measures once
  # (not startup_timeout_s); runs that use it are marked degraded (runner.run_info()).

run:
  seed: 2026                # recorded in run_config.json (problems run in file order; no sampling uses it yet)

budget:
  # Hard limit of LLM calls per problem (CLAUDE.md §1.5). Every logical call counts once:
  # cache hits and the JSON repair call included; transport retries of the same call do not.
  b_max: 16

spend:
  # Hard caps on real money (llm/spend.py). A paid call is sent only if its worst-case cost
  # (every prompt byte as a cache-miss token + all of max_tokens as output) fits under both
  # caps; otherwise the problem is `budget_stop` and the run ends. Only the team raises them.
  total_usd: 9.0            # whole project (sum of the ledger, all runs)
  run_usd: 1.0              # one run (run_eval.py --run-usd may lower it, never raise it)
  ledger: data/spend_ledger.jsonl   # one line per paid call; outside git
  default_max_tokens: 65536 # worst-case output when a request sets no max_tokens

llm:
  cache: true              # on-disk response cache; never turn it off without asking
  cache_dir: data/llm_cache
  json_repair: true         # one extra LLM call to repair unparsable JSON (counts for b_max)

baselines:
  # C1: the LLM writes only the tactic block (statement.proof_file builds the file,
  # sanitize checks it, the runner verifies). Independent samples, no error feedback.
  baseline_a:
    attempts: 4
  # C2: natural-language solution + self-assessment by the same model, never verified.
  # A new solution is drawn while the self-assessment says "incorrect".
  baseline_b:
    attempts: 2
