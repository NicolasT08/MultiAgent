# Pipeline hyperparameters; values of the report (Section IV-A), approved by the team 2026-10-31.
# config/ablations/C*.yaml override these keys per configuration (CLAUDE.md §1.7).
# Models are never named here: they live in config/models.yaml.

flow: full                  # full | baseline_a (C1) | baseline_b (C2): the graph's entry route

retrieval:
  enabled: true             # false: R_k(g) = ∅ and no name suggestions (C3)
  # Chosen on Q-dev in Phase 1.4 (2026-10-17): RRF over BM25 and the dense model
  # `embeddings.selected` (models.yaml), query with the model's instruction, k = 16.
  method: rrf               # rrf (BM25 + dense) | bm25 | dense
  k: 16                     # lemmas returned to the Generator (~1.5k tokens of name + signature)
  k_retry: 32               # k after a missing_lemma failure (Eq. 12); ~3.1k tokens, measured in Phase 1.4
  depth: 100                # candidates taken from each ranker before fusion
  rrf_k: 60                 # RRF constant: score(d) = sum 1 / (rrf_k + rank)
  query_instruction: true   # prepend the dense model's query instruction
  # Second query with concrete carriers (ℝ, ℤ, …) replaced by a type variable, fused by RRF
  # with the original one (retriever.generalize_query). Adopted 2026-10-19 after a manual
  # error analysis (generic lemmas such as two_mul_le_add_sq ranked behind Real.*), checked
  # on Q-dev only; Q-test re-evaluated once afterwards (PLAN.md 1.5).
  generic_query: true
  index_dir: data/index/full   # system index built from the FULL corpus (not corpus_eval)
  suggestions: 5            # max names suggested for an `unknown identifier` error

lean:
  # Back-end chosen 2026-10-25 (PLAN.md Phase 2): the Lean REPL keeps Mathlib loaded
  # (~0.01-0.5 s per check vs ~32 s for `lake env lean` per file). Fallback: per file.
  backend: repl             # repl | file
  project_dir: lean_project
  repl_dir: lean_repl       # built by scripts/build_repl.sh (tag v4.36.0-rc1)
  # Imports of the REPL's environment 0. Code whose imports are a subset runs in the REPL;
  # any other import goes to the file back-end. Keep it closed under Mathlib (Aesop is
  # imported by Mathlib, listed so that miniF2F headers `import Mathlib / import Aesop` fit).
  base_imports: [Mathlib, Aesop]
  timeout_s: 60             # wall clock per verification; on expiry the REPL is restarted
  startup_timeout_s: 2400   # import Mathlib: ~33 s warm, ~28 min cold on an HDD
  restart_every: 500        # preventive restart after N commands (REPL never frees envs)
  restart_memory_mb: 6000   # preventive restart when the REPL exceeds this after a command
  kill_memory_mb: 12000     # kill (status memory_limit) when a command exceeds this; also `lean -M`
  memory_poll_s: 0.5
  cache_size: 4096          # identical verifications answered from memory (0 = off)
  # Second layer of the sanitizer (option C, 2026-10-29; lean/syntax_check.py): generated text
  # that passes lean/sanitize.py is parsed by Lean's parser in the REPL and every syntax node
  # kind must be on the whitelist. One REPL command per check (~0.05-0.5 s).
  syntax_check: true
  syntax_timeout_s: 30
  # The file back-end's wall-clock limit is timeout_s + the import time it measures once
  # (not startup_timeout_s); runs that use it are marked degraded (runner.run_info()).

run:
  seed: 2026                # recorded in run_config.json (problems run in file order; no sampling uses it yet)

budget:
  # Hard limit of LLM calls per problem (CLAUDE.md §1.5). Every logical call counts once:
  # cache hits and the JSON repair call included; transport retries of the same call do not.
  # Eq. 13 with n_max = 3, k_max = 3, N = 3, R_max = 1, b_P = 1: min{40, 92} = 40.
  b_max: 40

critic:
  # Phase 6 (orchestrator/policy.py, agents/critic.py). π of Eq. 12 is rules; these are its limits.
  k_max: 3                  # attempts per subgoal, per plan
  r_max: 1                  # replans per problem
  llm_feedback: false       # one extra `critic` LLM call of advice per retry; never changes the action.
                            # On in C3 and C5 (config/ablations/); C4 never retries, so it never applies

spend:
  # Hard caps on real money (llm/spend.py). A paid call is sent only if its worst-case cost
  # (every prompt byte as a cache-miss token + all of max_tokens as output) fits under both
  # caps; otherwise the problem is `budget_stop` and the run ends. Only the team raises them.
  total_usd: 9.0            # whole project (sum of the ledger, all runs)
  run_usd: 1.0              # one run (run_eval.py --run-usd may lower it, never raise it)
  ledger: data/spend_ledger.jsonl   # one line per paid call; outside git
  default_max_tokens: 65536 # worst-case output when a request sets no max_tokens

llm:
  cache: true              # on-disk response cache; never turn it off without asking
  cache_dir: data/llm_cache
  json_repair: true         # one extra LLM call to repair unparsable JSON (counts for b_max)

planner:
  # Phase 4 (agents/planner.py). The LLM proposes at most n_max subgoals and a closing
  # tactic block; the code checks each piece (lean/sanitize.py), builds the skeleton
  # (statement.skeleton) and compiles it with `sorry` allowed. On any failure: the trivial
  # plan (the whole goal as the only subgoal), with the reason in the trace.
  n_max: 3
  retrieve: true            # give the model the Retriever's top-k lemmas (query: the theorem)
  check_skeleton: true      # compile the skeleton (REPL, ~0.1-0.5 s); false only in tests
  # Refutation (2026-10-29, team decision): before accepting a plan, try to prove the negation
  # of each subgoal from the theorem's hypotheses alone with these tactics (one file, no LLM).
  # A proved negation rejects the plan (`refuted:sg<i>`); first `<name>_consistent : False`:
  # if the hypotheses are contradictory, the check is skipped. Each lemma gets its own
  # heartbeat limit (miniF2F headers set maxHeartbeats 0); a wall-clock timeout refutes nothing
  # (and restarts the REPL, ~31 s). Measured on aime_1991_p1: 1.4-2.8 s per plan. The goal is
  # `False`, so tactics that ignore hypotheses (positivity, decide) are not listed.
  refute:
    enabled: true
    tactics: [omega, linarith, nlinarith, "norm_num at *", simp_all]
    heartbeats: 200000
    timeout_s: 20
  # When the model's closing block is not accepted, try these tactics as the closing step
  # (one lemma each, one file, no LLM); the first that is accepted replaces it
  # (`closing_auto:<tactic>`). Runs after the refutation check: nlinarith closes anything from
  # false subgoals.
  closing_auto:
    enabled: true
    tactics: [omega, linarith, norm_num, positivity, nlinarith]
    heartbeats: 200000
    timeout_s: 20

generator:
  # Phase 4 (agents/generator.py). N natural-language sketches per subgoal
  # (self-consistency), each labelled with a strategy of contracts.STRATEGIES; majority vote
  # over the labels (Eq. 9), ties broken by the order of STRATEGIES. Every sample is one
  # LLM call for b_max.
  samples: 3
  retrieve: true            # condition each subgoal on its own top-k lemmas (query: the subgoal)

autoformalizer:
  # Phase 5 (agents/autoformalizer.py). One call per attempt on a subgoal not closed by the
  # pre-pass: subgoal lemma + winning sketch + lemmas → tactic block (prompt by models.yaml →
  # prompt_style: chat | prover).
  retrieve: true            # the subgoal lemma's own top-k lemmas (same query as the Generator)

prepass:
  # Phase 5 (agents/prepass.py): before any LLM call, every tactic alone on the theorem, and
  # after the plan on every subgoal lemma; one compilation each time (one lemma per target and
  # tactic, heartbeat limit each), the first that compiles is confirmed with `accepted`.
  # `enabled: false` for the ablation. A wall-clock timeout finds nothing (REPL restart ~31 s).
  enabled: true
  tactics: [rfl, norm_num, simp, omega, linarith, positivity, nlinarith, decide]
  heartbeats: 200000
  timeout_s: 60

baselines:
  # C1: the LLM writes only the tactic block (statement.proof_file builds the file,
  # sanitize checks it, the runner verifies). Independent samples, no error feedback.
  # The budget of C1 is set in config/ablations/C1_baseline_a.yaml.
  baseline_a:
    attempts: 4
  # C2: natural-language solution + self-assessment by the same model, never verified.
  # A new solution is drawn while the self-assessment says "incorrect".
  baseline_b:
    attempts: 2
